name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret이 없어 debug 키로 서명합니다."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Gradle 배포 파일 다운로드가 가끔 504로 실패하므로 재시도
          for i in 1 2 3; do
            flutter build apk --release \
              --build-number=${{ github.run_number }} \
              --build-name=1.0.${{ github.run_number }} \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" && exit 0
            echo "::warning::빌드 실패 ($i/3), 30초 후 재시도"
            sleep 30
          done
          exit 1

      - name: Build release AAB (Play 스토어 업로드용)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release             --build-number=${{ github.run_number }}             --build-name=1.0.${{ github.run_number }}             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Rename outputs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk serial-todo.apk
          cp build/app/outputs/bundle/release/app-release.aab serial-todo.aab

      - uses: actions/upload-artifact@v4
        with:
          name: serial-todo-apk
          path: |
            serial-todo.apk
            serial-todo.aab

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - run: flutter pub get

      - name: Build Windows (바탕화면 위젯)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build windows --release             --build-number=${{ github.run_number }}             --build-name=1.0.${{ github.run_number }}             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Zip
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          Rename-Item "$out/serial_todo.exe" "할일이많아.exe"
          Compress-Archive -Path "$out/*" -DestinationPath serial-todo-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: serial-todo-windows
          path: serial-todo-windows.zip

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 할일이많아 1.0.${{ github.run_number }}
          body: |
            커밋 ${{ github.sha }} 에서 빌드했습니다.
            - `serial-todo.apk`: 폰에 바로 설치
            - `serial-todo.aab`: Google Play Console 업로드용
            - `serial-todo-windows.zip`: 윈도우 바탕화면 위젯(캘린더·할 일). 압축을 풀고 `할일이많아.exe` 실행
          files: |
            serial-todo.apk
            serial-todo.aab
            serial-todo-windows.zip
          make_latest: true
